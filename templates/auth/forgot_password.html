{% extends "base.html" %}
{% set no_sidebar = true %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-5 col-lg-4">
        <div class="text-center mb-4">
            <h3 class="fw-bold mt-2 text-primary">Forgot Password</h3>
            <p class="text-muted">Enter your email to reset your password</p>
        </div>

        <div class="card shadow border-0 rounded-4">
            <div class="card-body p-4 p-md-5">
                <form method="POST">
                    {{ form.hidden_tag() if form else '' }}
                    <div class="mb-4">
                        <label class="form-label">Email Address</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-gradient w-100 py-2 rounded-3 fw-medium mb-3">Send Reset Link</button>
                    <div class="text-center small">
                        Remembered? <a href="{{ url_for('auth.login') }}" class="text-decoration-none text-secondary fw-medium">Sign In</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
