{% extends "base.html" %}
{% set no_sidebar = true %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-100 mt-n5">
    <div class="col-md-5 col-lg-4">
        <div class="text-center mb-4">
            <i class="fa-solid fa-leaf text-accent" style="font-size: 3rem;"></i>
            <h2 class="fw-bold mt-2 text-primary">NexusBank</h2>
            <p class="text-muted">Digital Banking Platform</p>
        </div>

        <div class="card shadow border-0 rounded-4">
            <div class="card-body p-4 p-md-5">
                <h4 class="fw-bold mb-4 text-center">Welcome Back</h4>
                
                <form method="POST" action="{{ url_for('auth.login') }}">
                    {{ form.hidden_tag() }}
                    
                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fa-solid fa-envelope text-muted"></i></span>
                            <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <div class="d-flex justify-content-between">
                            <label class="form-label">Password</label>
                            <a href="{{ url_for('auth.forgot_password') }}" class="text-decoration-none small text-secondary">Forgot?</a>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fa-solid fa-lock text-muted"></i></span>
                            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                        </div>
                    </div>
                    
                    <div class="mb-4 form-check">
                        <input type="checkbox" class="form-check-input" id="remember" name="remember">
                        <label class="form-check-label small" for="remember">Remember me</label>
                    </div>
                    
                    <button type="submit" class="btn btn-gradient w-100 py-2 rounded-3 fw-medium mb-3">Sign In</button>
                    
                    <div class="text-center small">
                        Don't have an account? <a href="{{ url_for('auth.register') }}" class="text-decoration-none text-secondary fw-medium">Register</a>
                    </div>
                </form>
            </div>
            
            <div class="card-footer bg-light text-center py-3 border-0 rounded-bottom-4">
                <small class="text-muted">
                    <strong>DEMO MODE:</strong><br>
                    Login: demo@nexusbank.com | Pass: Demo@1234
                </small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
