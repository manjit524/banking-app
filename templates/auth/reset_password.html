{% extends "base.html" %}
{% set no_sidebar = true %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-5 col-lg-4">
        <div class="text-center mb-4">
            <h3 class="fw-bold mt-2 text-primary">Reset Password</h3>
            <p class="text-muted">Create a new secure password</p>
        </div>

        <div class="card shadow border-0 rounded-4">
            <div class="card-body p-4 p-md-5">
                <form method="POST">
                    {{ form.hidden_tag() if form else '' }}
                    <div class="mb-3">
                        <label class="form-label">New Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" name="confirm_password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-gradient w-100 py-2 rounded-3 fw-medium mb-3">Reset Password</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
