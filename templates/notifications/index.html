{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h3 class="fw-bold mb-0">Notifications</h3>
    </div>
    <button class="btn btn-outline-secondary rounded-pill px-4">
        <i class="fa-solid fa-check-double me-2"></i>Mark All Read
    </button>
</div>

<div class="card border-0 shadow-sm rounded-4">
    <div class="list-group list-group-flush rounded-4">
        <div class="list-group-item p-4 bg-light">
            <div class="d-flex align-items-start">
                <div class="bg-primary bg-opacity-10 text-primary rounded-circle p-3 me-3">
                    <i class="fa-solid fa-money-bill-transfer fs-5"></i>
                </div>
                <div class="flex-grow-1">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <h6 class="fw-bold mb-0">Money Received</h6>
                        <span class="small text-muted">10 mins ago</span>
                    </div>
                    <p class="text-muted mb-0">You have received ₹15,000 from John Doe.</p>
                </div>
                <div class="ms-3 align-self-center">
                    <span class="badge bg-danger rounded-pill">New</span>
                </div>
            </div>
        </div>
        
        <div class="list-group-item p-4">
            <div class="d-flex align-items-start">
                <div class="bg-warning bg-opacity-10 text-warning rounded-circle p-3 me-3">
                    <i class="fa-solid fa-file-invoice fs-5"></i>
                </div>
                <div class="flex-grow-1">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <h6 class="fw-bold mb-0">Bill Payment Due</h6>
                        <span class="small text-muted">2 days ago</span>
                    </div>
                    <p class="text-muted mb-0">Your electricity bill of ₹1,450 is due tomorrow.</p>
                </div>
            </div>
        </div>
        
        <div class="list-group-item p-4">
            <div class="d-flex align-items-start">
                <div class="bg-success bg-opacity-10 text-success rounded-circle p-3 me-3">
                    <i class="fa-solid fa-shield-check fs-5"></i>
                </div>
                <div class="flex-grow-1">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <h6 class="fw-bold mb-0">Login Detected</h6>
                        <span class="small text-muted">5 days ago</span>
                    </div>
                    <p class="text-muted mb-0">New login from Chrome on Windows.</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
