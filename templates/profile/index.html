{% extends "base.html" %}

{% block content %}
<h3 class="fw-bold mb-4">Profile & Settings</h3>

<div class="row g-4">
    <div class="col-lg-4">
        <div class="card border-0 shadow-sm rounded-4 text-center p-4">
            <div class="position-relative d-inline-block mx-auto mb-3">
                <img src="https://ui-avatars.com/api/?name={{ current_user.name|default('User') }}&background=0d3b2e&color=fff&size=128" class="rounded-circle" width="120" height="120">
                <button class="btn btn-sm btn-primary position-absolute bottom-0 end-0 rounded-circle" style="width: 32px; height: 32px;"><i class="fa-solid fa-camera"></i></button>
            </div>
            <h4 class="fw-bold mb-1">{{ current_user.name|default('Demo User') }}</h4>
            <p class="text-muted mb-3">{{ current_user.email|default('demo@nexusbank.com') }}</p>
            <span class="badge bg-success bg-opacity-10 text-success border border-success rounded-pill px-3 py-2">KYC Verified</span>
        </div>
    </div>
    
    <div class="col-lg-8">
        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-header bg-white border-bottom-0 pt-4 px-4">
                <ul class="nav nav-tabs card-header-tabs" id="myTab" role="tablist">
                    <li class="nav-item">
                        <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#personal">Personal Info</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#security">Security</button>
                    </li>
                </ul>
            </div>
            <div class="card-body p-4">
                <div class="tab-content">
                    <div class="tab-pane fade show active" id="personal">
                        <form>
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">Full Name</label>
                                    <input type="text" class="form-control" value="Demo User">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Phone Number</label>
                                    <input type="tel" class="form-control" value="+91 9876543210">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Address</label>
                                <textarea class="form-control" rows="3">123 Nexus Street, Mumbai, Maharashtra 400001, India</textarea>
                            </div>
                            <button type="button" class="btn btn-primary">Save Changes</button>
                        </form>
                    </div>
                    
                    <div class="tab-pane fade" id="security">
                        <h6 class="fw-bold mb-3">Change Password</h6>
                        <form class="mb-4 pb-4 border-bottom">
                            <div class="mb-3">
                                <input type="password" class="form-control" placeholder="Current Password">
                            </div>
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <input type="password" class="form-control" placeholder="New Password">
                                </div>
                                <div class="col-md-6">
                                    <input type="password" class="form-control" placeholder="Confirm New Password">
                                </div>
                            </div>
                            <button type="button" class="btn btn-primary">Update Password</button>
                        </form>
                        
                        <h6 class="fw-bold mb-3">Change MPIN</h6>
                        <form>
                            <div class="row mb-3">
                                <div class="col-md-4">
                                    <input type="password" class="form-control text-center letter-spacing-2" placeholder="Old MPIN" maxlength="6">
                                </div>
                                <div class="col-md-4">
                                    <input type="password" class="form-control text-center letter-spacing-2" placeholder="New MPIN" maxlength="6">
                                </div>
                            </div>
                            <button type="button" class="btn btn-primary">Update MPIN</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
