{% extends "base.html" %}

{% block title %}Register - NexusBank{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-5">
            <div class="text-center mb-4">
                <div class="icon-box mx-auto mb-3" style="width: 60px; height: 60px; background: rgba(55,214,153,0.1); color: var(--secondary-color); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem;">
                    <i class="fa-solid fa-user-plus"></i>
                </div>
                <h3 class="fw-bold">Create an Account</h3>
                <p class="text-muted">Join NexusBank today for a seamless banking experience</p>
            </div>

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-user text-muted"></i></span>
                        <input type="text" name="name" class="form-control border-start-0" placeholder="John Doe" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-envelope text-muted"></i></span>
                        <input type="email" name="email" class="form-control border-start-0" placeholder="you@example.com" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-key text-muted"></i></span>
                        <input type="password" name="password" class="form-control border-start-0" placeholder="••••••••" required>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label">Secure MPIN (For Transactions)</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-shield-halved text-muted"></i></span>
                        <input type="password" name="Mpin" class="form-control border-start-0" placeholder="4-6 digit MPIN" required>
                    </div>
                </div>
                <button class="btn btn-primary w-100 py-2">Create Account</button>
            </form>

            <div class="text-center mt-4">
                <p class="text-muted mb-0">Already have an account? <a href="/login" class="text-decoration-none fw-bold" style="color: var(--secondary-color);">Login here</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
