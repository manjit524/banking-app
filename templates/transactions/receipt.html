<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Transaction Receipt - NexusBank</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #f0f4f8; }
        .receipt-card { max-width: 600px; margin: 40px auto; background: #fff; padding: 40px; position: relative; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .watermark { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-45deg); font-size: 100px; color: rgba(0,0,0,0.03); white-space: nowrap; pointer-events: none; font-weight: 800; z-index: 0; }
        .qr-code { width: 100px; height: 100px; background: #eee; border: 1px solid #ccc; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #999; text-align: center; }
        @media print {
            body { background-color: #fff; }
            .receipt-card { box-shadow: none; margin: 0; padding: 20px; }
            .no-print { display: none; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="text-center no-print mt-4">
            <button onclick="window.print()" class="btn btn-primary me-2">Print Receipt</button>
            <a href="{{ url_for('transactions.detail', id=1) }}" class="btn btn-outline-secondary">Back</a>
        </div>
        
        <div class="receipt-card">
            <div class="watermark">DEMO / SANDBOX</div>
            
            <div class="text-center border-bottom pb-4 mb-4 position-relative z-1">
                <h2 class="fw-bold" style="color: #0d3b2e;">NexusBank</h2>
                <p class="text-muted mb-0">Transaction Receipt</p>
            </div>
            
            <div class="position-relative z-1">
                <h1 class="text-center display-4 fw-bold mb-4">₹2,450.00</h1>
                
                <div class="row mb-2">
                    <div class="col-6 text-muted">Status</div>
                    <div class="col-6 text-end fw-bold text-success">COMPLETED</div>
                </div>
                <div class="row mb-2">
                    <div class="col-6 text-muted">Date</div>
                    <div class="col-6 text-end fw-medium">Aug 10, 2026, 14:30 PM</div>
                </div>
                <div class="row mb-2">
                    <div class="col-6 text-muted">Transaction ID</div>
                    <div class="col-6 text-end font-monospace">TXN1000000</div>
                </div>
                <div class="row mb-2">
                    <div class="col-6 text-muted">Reference</div>
                    <div class="col-6 text-end font-monospace">REF-9876543210</div>
                </div>
                
                <hr class="my-4">
                
                <div class="row mb-2">
                    <div class="col-6 text-muted">From</div>
                    <div class="col-6 text-end fw-medium">Manjit (•••• 1000)</div>
                </div>
                <div class="row mb-2">
                    <div class="col-6 text-muted">To</div>
                    <div class="col-6 text-end fw-medium">Amazon Pay</div>
                </div>
                
                <div class="d-flex justify-content-between align-items-center mt-5 pt-3 border-top">
                    <div>
                        <p class="small text-muted mb-0">Thank you for banking with NexusBank.</p>
                        <p class="small text-muted mb-0">Support: 1800-NEXUS-BANK</p>
                    </div>
                    <div class="qr-code">SCAN<br>TO VERIFY</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
