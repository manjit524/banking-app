{% extends "base.html" %}
{% block title %}Transfer - NexusBank{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-5 shadow-sm">
            <div class="text-center mb-4">
                <div class="icon-box mx-auto mb-3" style="color: #3b82f6; background: rgba(59, 130, 246, 0.1);">
                    <i class="fa-solid fa-money-bill-transfer"></i>
                </div>
                <h3 class="fw-bold">Transfer Funds</h3>
                <p class="text-muted">Send money instantly to other accounts</p>
            </div>

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Recipient Account ID</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-building-columns text-muted"></i></span>
                        <input type="number" name="to_acc" class="form-control border-start-0 fs-5" placeholder="Account ID" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Amount (₹)</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 fw-bold text-muted">₹</span>
                        <input type="number" name="amount" class="form-control border-start-0 fs-5" min="1" placeholder="0.00" required>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label">Authorize with MPIN</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-shield-halved text-muted"></i></span>
                        <input type="password" name="Mpin" class="form-control border-start-0" placeholder="Enter your MPIN" required>
                    </div>
                </div>
                
                <button class="btn btn-primary w-100 py-2 mb-3" style="background: linear-gradient(135deg, #3b82f6, #2563eb); box-shadow: 0 4px 15px rgba(59,130,246,0.2);"><i class="fa-solid fa-paper-plane me-2"></i>Send Money</button>
                <a href="/dashboard" class="btn btn-secondary w-100 py-2 text-center text-decoration-none d-block">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
