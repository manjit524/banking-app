{% extends "base.html" %}

{% block content %}
<h3 class="fw-bold mb-4">Send Money</h3>

<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body p-4 p-md-5">
                <form id="transferForm" method="POST" action="{{ url_for('transfers.transfer') }}" class="needs-validation" novalidate>
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <input type="hidden" name="idempotency_key" id="idempotency_key">
                    <input type="hidden" name="to_account_number" id="to_account_number_hidden">
                    
                    <!-- Step 1 -->
                    <h5 class="fw-bold mb-3"><span class="badge bg-primary rounded-circle me-2">1</span> From Account</h5>
                    <div class="mb-4 ps-4">
                        <select name="from_account_id" class="form-select form-select-lg" required>
                            <option value="">Select an account...</option>
                            {% for account in accounts %}
                            <option value="{{ account.id }}">{{ account.account_type.value if account.account_type.value is defined else account.account_type }} ({{ account.account_number }}) - ₹{{ "{:,.2f}".format(account.available_balance) }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Step 2 -->
                    <h5 class="fw-bold mb-3"><span class="badge bg-primary rounded-circle me-2">2</span> To Beneficiary</h5>
                    <div class="mb-4 ps-4">
                        <ul class="nav nav-pills mb-3" id="pills-tab" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active" id="saved-tab" data-bs-toggle="pill" data-bs-target="#saved-ben" type="button">Saved Beneficiaries</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="new-tab" data-bs-toggle="pill" data-bs-target="#new-ben" type="button">New Account</button>
                            </li>
                        </ul>
                        <div class="tab-content" id="pills-tabContent">
                            <div class="tab-pane fade show active" id="saved-ben">
                                <select class="form-select" id="saved_beneficiary_select">
                                    <option value="">Select saved beneficiary...</option>
                                    {% for ben in beneficiaries %}
                                    <option value="{{ ben.account_number }}">{{ ben.name }} - {{ ben.bank_name }} ({{ ben.account_number }})</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="tab-pane fade" id="new-ben">
                                <input type="text" class="form-control mb-2" id="beneficiary_account" placeholder="Enter Account Number">
                                <div id="beneficiary_name_display" class="small mb-2 text-muted"></div>
                                <input type="text" class="form-control" placeholder="IFSC Code">
                            </div>
                        </div>
                    </div>

                    <!-- Step 3 -->
                    <h5 class="fw-bold mb-3"><span class="badge bg-primary rounded-circle me-2">3</span> Amount & Details</h5>
                    <div class="mb-4 ps-4">
                        <div class="input-group input-group-lg mb-3">
                            <span class="input-group-text bg-light text-success fw-bold">₹</span>
                            <input type="number" name="amount" id="amount" class="form-control fw-bold" placeholder="0.00" min="1" step="0.01" required>
                        </div>
                        <input type="text" name="description" class="form-control mb-3" placeholder="Description / Remarks (Optional)">
                    </div>

                    <!-- Preview Card -->
                    <div class="card bg-light border-0 mb-4 ps-4 ms-2">
                        <div class="card-body">
                            <h6 class="fw-bold mb-3">Transfer Summary</h6>
                            <div class="d-flex justify-content-between mb-2">
                                <span class="text-muted">Transfer Amount</span>
                                <span class="fw-medium text-success" id="preview_amount">₹0.00</span>
                            </div>
                            <div class="d-flex justify-content-between mb-2">
                                <span class="text-muted">Fee (DEMO)</span>
                                <span class="fw-medium">₹0.00</span>
                            </div>
                            <hr>
                            <div class="d-flex justify-content-between">
                                <span class="fw-bold">Total Deduction</span>
                                <span class="fw-bold fs-5" id="preview_total">₹0.00</span>
                            </div>
                        </div>
                    </div>

                    <!-- MPIN -->
                    <div class="mb-4 text-center">
                        <label class="form-label fw-bold">Enter 6-digit MPIN to confirm</label>
                        <input type="password" name="mpin" class="form-control form-control-lg text-center letter-spacing-2 mx-auto" style="max-width: 200px;" maxlength="6" pattern="\d{6}" required>
                    </div>

                    <button type="submit" class="btn btn-gradient btn-lg w-100 rounded-pill"><i class="fa-solid fa-paper-plane me-2"></i>Send Money</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
